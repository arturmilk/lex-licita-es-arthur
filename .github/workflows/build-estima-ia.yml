name: deploy-estima-ia

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "components/**"
      - "types/**"
      - "scripts/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.*"
      - ".github/workflows/build-estima-ia.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build + Deploy na VPS (arm64 nativo)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na Oracle VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/estimaia/repo
            GIT_SSH_COMMAND="ssh -i ~/.ssh/estimaia_deploy -o StrictHostKeyChecking=accept-new" git fetch origin
            GIT_SSH_COMMAND="ssh -i ~/.ssh/estimaia_deploy" git reset --hard origin/main
            git log --oneline -1
            docker build -t ghcr.io/jacquesbelmont/estimaia-app:latest .
            cd /opt/estimaia
            docker compose --env-file .env up -d app
            docker image prune -f
            echo "Deploy concluido: $(date)"
