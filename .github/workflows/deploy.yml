name: Deploy → VPS (estima-ia)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy Estima-IA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Enviar arquivos para o VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".,!node_modules,!.next,!.env,!data,!postgres-data,!minio-data"
          target: "/opt/sentia/estima-ia"
          rm: false
          overwrite: true
          strip_components: 0

      - name: Rebuild e restart no VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/sentia/estima-ia
            docker compose build app
            docker compose up -d app
            echo "✅ Estima-IA deployada — $(date)"
