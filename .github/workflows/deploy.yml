name: Deploy → VPS (estima-ia)

on:
  workflow_run:
    workflows: ["build-estima-ia"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Pull imagem GHCR + restart
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Deploy na Oracle VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u jacquesbelmont --password-stdin
            docker pull ghcr.io/jacquesbelmont/estima-ia-app:latest
            cd /opt/estimaia
            docker compose --env-file .env up -d app
            docker image prune -f
            echo "Deploy concluido: $(date)"
