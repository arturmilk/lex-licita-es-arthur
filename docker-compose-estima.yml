version: '3.9'

networks:
  internal:
    driver: bridge
  sentia-proxy:
    external: true

services:
  postgres:
    image: postgres:16-alpine
    container_name: estimaia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: estimaia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: estimaia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimaia"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: estimaia-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: estimaia
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  app:
    image: estima-ia-app:local
    container_name: estimaia-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://estimaia:${POSTGRES_PASSWORD}@postgres:5432/estimaia
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: estimaia
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      MINIO_BUCKET: estimaia
      AGENT_API_KEY: ${AGENT_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      PNCP_PROXY_URL: ${PNCP_PROXY_URL:-http://172.21.0.1:8787}
      PNCP_PROXY_TOKEN: ${PNCP_PROXY_TOKEN:-}
      NODE_ENV: production
    networks:
      - internal
      - sentia-proxy
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w2 127.0.0.1 3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  minio_data:
